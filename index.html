<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albion Online 서버 상태</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }
        h1 {
            margin-top: 50px;
        }
        .server-status {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            padding: 10px;
            display: inline-block;
            border-radius: 5px;
            width: 300px;
        }
        .online {
            color: green;
            background-color: #d4f5d4;
        }
        .maintenance {
            color: orange;
            background-color: #ffeeba;
        }
        .offline {
            color: red;
            background-color: #f8d7da;
        }
    </style>
</head>
<body>
    <h1>Albion Online 서버 상태</h1>

    <div id="eu-server" class="server-status">유럽 서버: 로딩 중...</div>
    <div id="asia-server" class="server-status">아시아 서버: 로딩 중...</div>
    <div id="west-server" class="server-status">서부 서버: 로딩 중...</div>

    <script>
        const servers = {
            "eu-server": "https://www.albionstatus.com/api/status/eu",
            "asia-server": "https://www.albionstatus.com/api/status/asia",
            "west-server": "https://www.albionstatus.com/api/status/us"
        };

        async function fetchServerStatus() {
            for (const [serverId, apiUrl] of Object.entries(servers)) {
                try {
                    const response = await fetch(apiUrl);
                    const data = await response.json();
                    const statusElement = document.getElementById(serverId);

                    if (data.status === "online") {
                        statusElement.innerHTML = `✅ ${serverId.replace("-server", "").toUpperCase()} 서버: 온라인 🟢`;
                        statusElement.className = "server-status online";
                    } else if (data.status === "maintenance") {
                        statusElement.innerHTML = `⚠️ ${serverId.replace("-server", "").toUpperCase()} 서버: 유지 보수 중 🟡`;
                        statusElement.className = "server-status maintenance";
                    } else if (data.status === "offline") {
                        statusElement.innerHTML = `🚨 ${serverId.replace("-server", "").toUpperCase()} 서버: 오프라인 🔴`;
                        statusElement.className = "server-status offline";
                    } else {
                        statusElement.innerHTML = `❓ ${serverId.replace("-server", "").toUpperCase()} 서버: 상태 확인 불가`;
                    }
                } catch (error) {
                    document.getElementById(serverId).innerHTML = `❌ ${serverId.replace("-server", "").toUpperCase()} 서버: 오류 발생`;
                }
            }
        }

        fetchServerStatus();
        setInterval(fetchServerStatus, 300000); // 5분마다 자동 업데이트
    </script>
</body>
</html>
